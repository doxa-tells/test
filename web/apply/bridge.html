<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Открываю почтовый клиент…</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:24px;background:#0f0f12;color:#eaecef}
  a.btn{display:inline-block;padding:12px 16px;border-radius:12px;background:#2f81f7;color:#fff;text-decoration:none;margin-top:12px}
</style>
</head>
<body>
<h1>Открываю почтовый клиент…</h1>
<p>Если ничего не произошло за 2 секунды, нажмите кнопку ниже.</p>
<p><a id="btn" class="btn" href="#">Открыть почтовый клиент</a></p>
<script>
(function(){
  const usp = new URLSearchParams(location.search);
  const to = usp.get('to') || '';
  const subject = usp.get('subject') || '';
  const body = usp.get('body') || '';
  function mailto(to, subject, body){
    const p=[]; if(subject) p.push('subject='+encodeURIComponent(subject));
    if(body) p.push('body='+encodeURIComponent(body));
    return `mailto:${to}${p.length?'?'+p.join('&'):''}`;
  }
  const url = mailto(to, subject, body);
  const btn = document.getElementById('btn');
  btn.href = url;
  setTimeout(function(){ location.href = url; }, 400);
})();
</script>
</body>
</html>
