server {
    server_name roletapp.kz;

    root /opt/casting_mirror_bot/web;
    index index.html;

    # Проксирование всей ветки TipTopPay API к uvicorn
    location /api/tiptoppay/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # (Опционально) Явная локация вебхука — можно оставить
    location = /api/tiptoppay/webhook {
        proxy_pass http://127.0.0.1:8000/api/tiptoppay/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Telegram Mini App: https://roletapp.kz/apply/
    location /apply/ {
        alias /opt/casting_mirror_bot/web/apply/;
        index index.html;
        try_files $uri $uri/ /apply/index.html;

        # разрешаем встраивание в Telegram WebApp/iframe
        add_header X-Frame-Options "" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://*.telegram.org https://web.telegram.org" always;
    }

    # Статика
    location / {
        try_files $uri $uri/ =404;
    }

    # SSL (Certbot)
    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/roletapp.kz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/roletapp.kz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Gzip (оставил включённым)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml application/rss+xml image/svg+xml;
    gzip_min_length 1024;
}

# Редирект 80 -> 443
server {
    listen 80;
    listen [::]:80;
    server_name roletapp.kz;
    return 301 https://$host$request_uri;
}
