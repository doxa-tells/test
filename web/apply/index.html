<!doctype html>
<html lang="ru">
<head>
  <link rel="stylesheet" href="styles.css?v=20251010-10">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Отклик на кастинг — Roletapp</title>
  <link rel="stylesheet" href="styles.css?v=20251010-10" />
  <!-- Telegram WebApp SDK (без него не будет тёмной темы и expand) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="container">
    <header class="header">
  <link rel="stylesheet" href="styles.css?v=20251010-10">
      <div class="logo">🎬</div>
      <div class="title">
        <h1>Отклик на кастинг</h1>
        <p class="subtitle">Проверьте письмо и отправьте с вашего почтового клиента</p>
      </div>
    </header>

    <main>
      <div class="field">
        <label for="to">Email получателя</label>
        <input id="to" type="email" inputmode="email" placeholder="mail@example.com" />
      </div>

      <div class="field">
        <label for="subject">Тема письма</label>
        <input id="subject" type="text" />
      </div>

      <div class="field">
        <label for="body">Сообщение</label>
        <textarea id="body" rows="12"></textarea>
        <div class="hint">Текст можно отредактировать перед отправкой.</div>
      </div>

      <div class="actions">
        <a id="btn-open" class="btn" href="#" rel="noopener">📧 Открыть почтовый клиент</a>
        <button id="btn-copy">📋 Скопировать текст</button>
      </div>

      <div id="warn" class="warn" hidden>
        ⚠️ Длина письма большая. Если почтовый клиент не откроется, скопируйте текст и вставьте вручную.
      </div>
    </main>

    <footer class="footer">
      <button id="btn-close" class="ghost">Закрыть</button>
    </footer>
  </div>

  <script src="./apply.js?v=20251010-12"></script>
</body>
</html>
